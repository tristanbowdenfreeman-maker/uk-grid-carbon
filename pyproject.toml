[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-carbon"
version = "0.1.0"
description = "Carbon intensity of Britain's electricity grid since 2017, with weather and climate context, modelled in DuckDB"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
